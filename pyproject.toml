[project]
name = "aml-reporter"
version = "0.1.0"
description = "AI-assisted investigation reports for AML alerts. Portfolio prototype built on synthetic data only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mauro Russo" }]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # naming conventions
    "UP",  # modern Python syntax
    "B",   # likely bugs
    "SIM", # simplifications
    "S",   # security checks
    "D",   # docstrings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # pytest relies on bare asserts

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]

[tool.coverage.run]
source = ["aml_reporter"]
branch = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]
