[project]
name = "aml-reporter"
version = "0.1.0"
description = "AI-assisted investigation reports for AML alerts. Portfolio prototype built on synthetic data only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mauro Russo" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "typer>=0.27.3",
]

[project.scripts]
aml-report = "aml_reporter.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # naming conventions
    "UP",  # modern Python syntax
    "B",   # likely bugs
    "SIM", # simplifications
    "S",   # security checks
    "D",   # docstrings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"] # pytest relies on bare asserts; tests use seeded randomness
"src/aml_reporter/synthetic/**" = ["S311"] # seeded, reproducible randomness is the goal here

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-m",
    "not integration",
]
markers = ["integration: calls a real LLM backend; run with `pytest -m integration`"]

[tool.coverage.run]
source = ["aml_reporter"]
branch = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]
