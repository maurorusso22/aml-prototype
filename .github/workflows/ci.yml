name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, so the full release is pinned
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          # The gitleaks hook only scans staged changes; the secret-scan job covers full history
          SKIP: gitleaks
      - name: Run tests
        run: uv run pytest --cov --cov-report=term-missing

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: >
          curl -sSfL
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          | tar -xz gitleaks
      - name: Scan full git history
        run: ./gitleaks git --redact --verbose .
